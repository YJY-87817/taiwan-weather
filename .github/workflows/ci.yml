name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch makes the run for the older one pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # Android Gradle Plugin downloads missing SDK components once the licenses are accepted.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Lint
        run: sh ./gradlew lintDebug --console=plain

      - name: Unit tests
        run: sh ./gradlew testDebugUnitTest --console=plain

      - name: Build debug APK
        run: sh ./gradlew assembleDebug --console=plain

      # Kept for passing runs too, so lint warnings can be read without failing the build.
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          if-no-files-found: ignore
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
